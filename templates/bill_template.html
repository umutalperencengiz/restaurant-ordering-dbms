<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .total-price {
            margin-top: 20px;
            text-align: right;
        }
        .bill-info {
            margin-top: 30px;
        }
        .bill-info p {
            margin: 10px 0;
            color: #666;
        }
        .highlight {
            background-color: #e0f7fa;
        }
        .total-price strong {
            font-size: 18px;
            color: #ff5722;
        }
        .actions {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .button {
            background-color: #4caf50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            display: inline-block;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            cursor: pointer;
            font-size: 15px;
        }
        .button:hover {
            background-color: #45a049;
        }
        .button.secondary {
            background-color: #6c757d;
        }
        .button.secondary:hover {
            background-color: #5a6268;
        }
        @media print {
            body { background: #fff; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .actions { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bill</h1>
        <div class="bill-info">
            <p><strong>Bill No:</strong> {{ bill_no }}</p>
            <p><strong>Bill Date:</strong> {{ bill_date }}</p>
            <p><strong>Customer Name:</strong> {{ customer_name }}</p>
            <p><strong>Contact No:</strong> {{ contact_no }}</p>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Dish Name</th>
                    <th>Qty</th>
                    <th>Total (PLN)</th>
                </tr>
            </thead>
            <tbody>
                {% for order in orders %}
                <tr class="highlight">
                    <td>{{ order[0] }}</td>
                    <td>{{ order[1] }}</td>
                    <td>{{ "%.2f"|format(order[2]) }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="total-price">
            <strong>Total Price (in PLN):</strong> <span class="highlight">{{ total_price }}</span>
        </div>
        <div class="actions">
            <a href="/generate_bills" class="button secondary">&larr; Back</a>
            <button type="button" class="button" onclick="window.print()">Print</button>
        </div>
    </div>
</body>
</html>
