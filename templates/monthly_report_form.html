<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Summarized Report of Ingredient Orders</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 50px;
        }

        form {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
        }

        input[type="month"] {
            width: calc(100% - 70px); /* Adjust based on your preference */
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Generate Monthly Summarized Report of Ingredient Orders</h2>
    <form action="/show_ingredients" method="post">
        <label for="order_date">Order Date (MM/YYYY):</label>
        <input type="month" id="order_date" name="order_date">
        <button type="submit">Generate Report</button>
    </form>

    <p style="text-align:center;margin-top:18px;font-size:14px;">
        <a href="/sales_clerk_dashboard" style="color:#007bff;text-decoration:none;">&larr; Back to dashboard</a>
    </p>
</body>
</html>
