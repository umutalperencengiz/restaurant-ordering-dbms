<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .login-container {
            width: 300px;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: #555;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        .login-toggle {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .login-toggle button {
            width: 48%;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>

        <div class="login-toggle">
            <button onclick="showSalesClerkLogin()">Sales Clerk</button>
            <button onclick="showCustomerLogin()">Customer</button>
        </div>

        <div id="salesClerkLogin">
            <h2>Sales Clerk Login</h2>
            <form action="/sales_clerk_login" method="POST">
                <input type="email" name="email" placeholder="Email" required><br>
                <input type="password" name="password" placeholder="Password" required><br>
                <button type="submit">Login</button>
            </form>
        </div>

        <div id="customerLogin" style="display: none;">
            <h2>Customer Login</h2>
            <form action="/customer_login" method="POST">
                <input type="text" name="name" placeholder="Name" required><br>
                <input type="tel" name="telephone" placeholder="Telephone Number" required><br>
                <input type="email" name="email" placeholder="Email" required><br>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <script>
        function showSalesClerkLogin() {
            document.getElementById('salesClerkLogin').style.display = 'block';
            document.getElementById('customerLogin').style.display = 'none';
        }

        function showCustomerLogin() {
            document.getElementById('customerLogin').style.display = 'block';
            document.getElementById('salesClerkLogin').style.display = 'none';
        }
    </script>
</body>
</html>
